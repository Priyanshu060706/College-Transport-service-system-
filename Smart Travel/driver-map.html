<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Map & Route | Smart Travel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Leaflet CSS & JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        brand: {
                            50: '#eff6ff', 100: '#dbeafe', 500: '#3b82f6',
                            600: '#2563eb', 700: '#1d4ed8', 900: '#1e3a8a',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #f8fafc; }
        #map { height: calc(100vh - 140px); width: 100%; border-radius: 1.5rem; z-index: 10; }
        .smooth-shadow { box-shadow: 0 4px 20px -2px rgba(37, 99, 235, 0.08); }
    </style>
</head>
<body class="text-slate-800 antialiased h-screen flex flex-col overflow-hidden">

    <!-- TOP NAVIGATION BAR -->
    <nav class="bg-white border-b border-slate-200 flex-shrink-0 z-20 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-16">
                <div class="flex items-center gap-3">
                    <a href="driver-portal.html" class="w-9 h-9 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl flex items-center justify-center transition">
                        <i class="fa-solid fa-arrow-left"></i>
                    </a>
                    <div>
                        <h1 class="font-extrabold text-sm text-slate-900" id="headerBusTitle">Live Fleet Navigation</h1>
                        <p class="text-[10px] text-emerald-600 font-bold uppercase tracking-wider">GPS Trail & Red Heading Strap Active</p>
                    </div>
                </div>
                <div class="flex items-center gap-2">
                    <span id="gpsStatusPill" class="bg-amber-100 text-amber-700 text-xs font-bold px-3 py-1 rounded-full flex items-center gap-1.5">
                        <span class="w-2 h-2 rounded-full bg-amber-500"></span> GPS Standby
                    </span>
                </div>
            </div>
        </div>
    </nav>

    <!-- MAP CONTAINER WITH FLOATING CONTROLS -->
    <main class="flex-1 p-4 relative flex flex-col">
        <div class="flex-1 bg-white rounded-3xl p-3 border border-slate-200 smooth-shadow relative">
            <div id="map"></div>

            <!-- FLOATING OVERLAY CARD -->
            <div class="absolute bottom-6 left-6 right-6 sm:left-auto sm:right-6 sm:w-80 bg-white/95 backdrop-blur-md rounded-2xl p-4 shadow-xl border border-slate-200 z-[400] space-y-3">
                <div class="flex justify-between items-center">
                    <span class="text-xs font-bold text-slate-500 uppercase">Telemetry Stream</span>
                    <span class="text-xs font-mono font-bold text-brand-600" id="speedReadout">0 km/h</span>
                </div>
                <div class="text-xs space-y-1 font-mono text-slate-600 bg-slate-50 p-2.5 rounded-xl border border-slate-100">
                    <p>Lat: <span id="latVal" class="text-slate-900 font-bold">--.----</span></p>
                    <p>Lng: <span id="lngVal" class="text-slate-900 font-bold">--.----</span></p>
                </div>
                <button onclick="toggleMapBroadcast()" id="mapBroadcastBtn" class="w-full py-3 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-xl transition shadow-md text-xs flex items-center justify-center gap-2">
                    <i class="fa-solid fa-play"></i> Start Navigation & Trail
                </button>
            </div>
        </div>
    </main>

    <!-- FIREBASE & LEAFLET MAP SCRIPT -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getDatabase, ref, update, remove } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

        // REAL FIREBASE CONFIG INJECTED
        const firebaseConfig = {
            apiKey: "AIzaSyAlqXUgn1eLkbV4A2oAlg7p6uXIUlKlbWk",
            authDomain: "smart-travel-bus.firebaseapp.com",
            databaseURL: "https://smart-travel-bus-default-rtdb.firebaseio.com",
            projectId: "smart-travel-bus",
            storageBucket: "smart-travel-bus.firebasestorage.app",
            messagingSenderId: "786326805651",
            appId: "1:786326805651:web:f0880add0c5a1f67908166",
            measurementId: "G-MXJ0Y5HDWT"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        const activeBus = JSON.parse(localStorage.getItem('activeDriverBus')) || {
            busNumber: "Bus #21",
            route: "ISBT Shuttle Corridor",
            firebaseKey: "bus_21"
        };

        document.getElementById('headerBusTitle').innerText = `${activeBus.busNumber} Navigation Map`;

        // Initialize Leaflet Map centered on Dehradun
        const map = L.map('map').setView([30.3165, 78.0322], 15);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(map);

        const busIcon = L.divIcon({
            className: 'bus-marker',
            html: '<div style="background:#2563eb; color:white; width:40px; height:40px; border-radius:50%; border:3px solid white; box-shadow:0 4px 12px rgba(37,99,235,0.4); display:flex; align-items:center; justify-content:center; font-size:16px;"><i class="fa-solid fa-bus"></i></div>',
            iconSize: [40, 40], iconAnchor: [20, 20]
        });

        let marker = null;
        let routeCoordinates = []; 
        let redStrapPolyline = L.polyline([], { color: '#dc2626', weight: 6, opacity: 0.85 }).addTo(map);

        let isBroadcasting = false;
        let watchId = null;
        let simulateInterval = null;

        window.toggleMapBroadcast = function() {
            const btn = document.getElementById('mapBroadcastBtn');
            const statusPill = document.getElementById('gpsStatusPill');

            if (!isBroadcasting) {
                isBroadcasting = true;
                statusPill.className = "bg-brand-100 text-brand-700 text-xs font-bold px-3 py-1 rounded-full flex items-center gap-1.5 animate-pulse";
                statusPill.innerHTML = '<span class="w-2 h-2 rounded-full bg-brand-500"></span> Acquiring GPS...';

                // Base coordinates for laptop simulation fallback
                let currentLat = 30.3165 + (Math.random() - 0.5) * 0.01;
                let currentLng = 78.0322 + (Math.random() - 0.5) * 0.01;

                const processPosition = (lat, lng, speedVal = "28.4") => {
                    const now = new Date().toLocaleTimeString();
                    const currentLatLng = [lat, lng];
                    
                    routeCoordinates.push(currentLatLng);
                    redStrapPolyline.setLatLngs(routeCoordinates);

                    if (!marker) {
                        marker = L.marker(currentLatLng, { icon: busIcon }).addTo(map)
                            .bindPopup(`<b>${activeBus.busNumber}</b><br/>${activeBus.route}`).openPopup();
                    } else {
                        marker.setLatLng(currentLatLng);
                    }
                    map.panTo(currentLatLng);

                    document.getElementById('latVal').innerText = lat.toFixed(4);
                    document.getElementById('lngVal').innerText = lng.toFixed(4);
                    document.getElementById('speedReadout').innerText = speedVal + " km/h";

                    statusPill.className = "bg-emerald-100 text-emerald-700 text-xs font-bold px-3 py-1 rounded-full flex items-center gap-1.5";
                    statusPill.innerHTML = '<span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span> LIVE Broadcasting';

                    btn.innerHTML = '<i class="fa-solid fa-stop"></i> Stop Navigation & Trail';
                    btn.className = "w-full py-3 bg-red-600 hover:bg-red-700 text-white font-bold rounded-xl transition shadow-md text-xs flex items-center justify-center gap-2";

                    // Push to Firebase Realtime Database
                    update(ref(db, `buses/${activeBus.firebaseKey}`), {
                        busNumber: activeBus.busNumber,
                        lat: lat,
                        lng: lng,
                        statusMsg: "On Schedule (Live Map)",
                        sosActive: false,
                        updatedAt: now
                    });
                };

                if (navigator.geolocation) {
                    watchId = navigator.geolocation.watchPosition(
                        (position) => {
                            const speed = position.coords.speed ? (position.coords.speed * 3.6).toFixed(1) : "32.0";
                            processPosition(position.coords.latitude, position.coords.longitude, speed);
                        },
                        (error) => {
                            console.warn("GPS restricted, switching to smooth laptop movement simulation:", error.message);
                            simulateInterval = setInterval(() => {
                                currentLat += (Math.random() - 0.45) * 0.0012;
                                currentLng += (Math.random() - 0.45) * 0.0012;
                                processPosition(currentLat, currentLng, "35.2");
                            }, 2500);
                        },
                        { enableHighAccuracy: true, maximumAge: 0, timeout: 5000 }
                    );
                } else {
                    simulateInterval = setInterval(() => {
                        currentLat += (Math.random() - 0.45) * 0.0012;
                        currentLng += (Math.random() - 0.45) * 0.0012;
                        processPosition(currentLat, currentLng, "35.2");
                    }, 2500);
                }

            } else {
                // STOPPING BROADCAST: Clear watch, clear interval, remove from Firebase
                if (watchId !== null) navigator.geolocation.clearWatch(watchId);
                if (simulateInterval !== null) clearInterval(simulateInterval);
                isBroadcasting = false;

                // Remove bus record from Firebase so student portal clears instantly
                remove(ref(db, `buses/${activeBus.firebaseKey}`));

                if (marker) {
                    map.removeLayer(marker);
                    marker = null;
                }
                routeCoordinates = [];
                redStrapPolyline.setLatLngs([]);

                statusPill.className = "bg-amber-100 text-amber-700 text-xs font-bold px-3 py-1 rounded-full flex items-center gap-1.5";
                statusPill.innerHTML = '<span class="w-2 h-2 rounded-full bg-amber-500"></span> GPS Standby';

                btn.innerHTML = '<i class="fa-solid fa-play"></i> Start Navigation & Trail';
                btn.className = "w-full py-3 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-xl transition shadow-md text-xs flex items-center justify-center gap-2";
                
                document.getElementById('latVal').innerText = "--.----";
                document.getElementById('lngVal').innerText = "--.----";
                document.getElementById('speedReadout').innerText = "0 km/h";
            }
        };
    </script>
</body>
</html>
